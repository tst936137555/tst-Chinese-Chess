# CI：analyze + 全量测试 + Android 编译检查 + 签名 release 构建
#
# 说明：
# - 引擎协议可靠性（握手/看门狗/崩溃恢复/fail-fast）由内存伪造引擎驱动，
#   无需真实引擎二进制，可在 Linux CI 完整运行（见 test/engine_reliability_test.dart）。
# - 真实引擎端到端测试（test/review_engine_integration_test.dart）在无引擎
#   环境自动跳过，仅在本机（Windows/macOS）运行。
# - 引擎 / NNUE / 字体等大文件不入库：CI 与本地统一通过 tool/fetch_engine.ps1
#   按 tool/engine_manifest.json 从上游官方 release 下载并做 SHA256 校验；
#   上游失败时回退本仓库镜像 release（engine-mirror，由
#   .github/workflows/engine-mirror.yml 转存维护，防上游下架）。
# - android-release：从仓库 secrets 还原正式签名密钥，构建签名 release APK
#   （arm64 引擎 / NNUE / 字体由 fetch 脚本取得；x86_64 引擎官方不发布，
#   由 tool/build_android_engine.sh 以钉住的 NDK r28c 现场编译），
#   产物上传为 artifact；打 v* 标签推送时额外创建 GitHub Release 并附 APK。
#   首次使用前需配置 4 个 secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
#   KEY_ALIAS / KEY_PASSWORD），见项目文档。
# - windows-release：经 fetch 脚本取得钉住版本的官方 Pikafish Windows 引擎
#   与许可证文本一并打入 zip，产物上传为 artifact；打 v* 标签推送时附到
#   同一 GitHub Release（与 android-release 并行，创建 Release 双方容错）。
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 钉住 Flutter 版本：stable 滚动升级可能在零代码变更时使 CI 变红
  # （本工具链 AGP 9 + Kotlin 2.4 + Gradle 9.3 对 Flutter 插件版本敏感）。
  # 与 pubspec.lock 约束（>=3.44.0）及本地开发版本保持一致，升版时同步修改
  FLUTTER_VERSION: '3.47.2'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # pubspec 声明的 NNUE / 字体 / 许可证资产缺文件会导致构建失败，先经脚本取得
      - name: Install p7zip (fetch script dependency)
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      - name: Fetch pinned assets (NNUE + font)
        shell: pwsh
        run: ./tool/fetch_engine.ps1 -Target core

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  android-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # arm64 引擎 + NNUE + 字体（模拟器 x86_64 引擎不在 push 检查中编译）
      - name: Install p7zip (fetch script dependency)
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      - name: Fetch pinned engine (arm64 + NNUE + font)
        shell: pwsh
        run: ./tool/fetch_engine.ps1 -Target android

      - name: flutter build apk (debug)
        run: flutter build apk --debug

  android-release:
    name: Android Release (signed)
    # 仅 tag（v*）推送或手动触发时构建 release；PR 不跑（secrets 不可用）
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 需要
    steps:
      - uses: actions/checkout@v5
        with:
          # 发行说明自动生成需要完整提交历史与全部 tag
          # （浅克隆下 git describe "$TAG^" 无法解析，提交分组会退化为单条）
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # arm64 引擎 / NNUE / 字体 / 许可证由 fetch 脚本取得；x86_64 官方不发布，现场编译
      - name: Install p7zip (fetch script dependency)
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full

      - name: Fetch pinned engine (arm64 + NNUE + font + licenses)
        shell: pwsh
        run: ./tool/fetch_engine.ps1 -Target android

      - name: Setup NDK r28c (pinned, matches README build recipe)
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Build Android x86_64 engine (not published upstream)
        run: ./tool/build_android_engine.sh x86_64
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，请在仓库 Settings → Secrets and variables → Actions 配置（4 个：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > tst_xiangqi-release.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=../tst_xiangqi-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: flutter build apk (release, signed)
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK with version
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)"
          cp build/app/outputs/flutter-apk/app-release.apk "tst_xiangqi-${VERSION}.apk"
          echo "APK_NAME=tst_xiangqi-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 与 windows-release 并行创建同一 Release：先尝试创建，
          # 已存在（对方先建）则改为追加附件。
          # 发行说明优先级：CHANGELOG.md 手写段落 > 提交历史自动分组，
          # 两种来源最终都会附带 GitHub 自动生成的提交对比
          TAG="$GITHUB_REF_NAME"
          NOTES=$(awk -v ver="## $TAG" '
            $0 == ver {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            # 自动生成：取上一 tag 以来的提交，按 conventional 类型分组
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$TAG"; else RANGE="$TAG"; fi
            echo "commit range: $RANGE" >&2
            gen_group() {
              local pattern="$1" label="$2" items
              items=$(git log "$RANGE" --no-merges --pretty=format:'%s' \
                | grep -iE "^(${pattern})[:：]" | sed 's/^[^:：]*[:：] *//' \
                | sed 's/^/- /')
              [ -n "$items" ] && printf '### %s\n%s\n\n' "$label" "$items"
            }
            # 命令替换会吞尾部换行，先落盘再整体读取，避免组间粘连
            NOTES_FILE=$(mktemp)
            {
              gen_group 'feat' '新增'
              gen_group 'fix' '修复'
              gen_group 'perf' '优化'
              gen_group 'refactor' '重构'
              gen_group 'docs|test|chore|ci|style' '其他变更'
            } > "$NOTES_FILE"
            NOTES=$(cat "$NOTES_FILE")
          fi
          if [ -n "$NOTES" ]; then
            if ! gh release create "$TAG" "$APK_NAME" \
                --title "$TAG" --notes "$NOTES" --generate-notes; then
              gh release upload "$TAG" "$APK_NAME" --clobber
            fi
          else
            if ! gh release create "$TAG" "$APK_NAME" \
                --title "$TAG" --generate-notes; then
              gh release upload "$TAG" "$APK_NAME" --clobber
            fi
          fi

  windows-release:
    name: Windows Release (bundled engine)
    # 仅 tag（v*）推送或手动触发时构建 release；PR 不跑
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: windows-latest
    permissions:
      contents: write # 向 GitHub Release 追加附件需要
    steps:
      - uses: actions/checkout@v5
        with:
          # 发行说明自动生成需要完整提交历史与全部 tag
          fetch-depth: 0
          fetch-tags: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # NNUE / 字体资产必须先于构建就位（pubspec 声明）；引擎 exe 与许可证
      # 文本由同一脚本按 manifest 取得并校验（总包与成员双重 SHA256）
      - name: Fetch pinned Pikafish (engine + NNUE + font + licenses)
        shell: pwsh
        run: ./tool/fetch_engine.ps1 -Target windows

      - name: flutter build windows (release)
        run: flutter build windows --release

      - name: Bundle engine & licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 引擎与 app 主程序同目录；许可证一并拷入 zip 根目录便于直接查看
          # （GPLv3 分发合规：随包附带许可与来源信息；正文同时已作为
          # Flutter 资产打进应用内，App「作者声明」可离线查看）
          $bundle = "build\windows\x64\runner\Release"
          Copy-Item "pikafish.exe" "$bundle\pikafish.exe"
          Copy-Item "assets\licenses\COPYING-pikafish.txt" "$bundle\COPYING-pikafish.txt"
          Copy-Item "assets\licenses\NNUE-License.md" "$bundle\NNUE-License.md"
          Get-ChildItem $bundle | Select-Object Name, Length

      - name: Smoke-test bundled engine
        shell: pwsh
        run: |
          # 引擎自检：确认 zip 内 pikafish.exe 能完成基础 UCI 握手
          $exe = "build\windows\x64\runner\Release\pikafish.exe"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.WriteLine("uci")
          $p.StandardInput.WriteLine("quit")
          $out = $p.StandardOutput.ReadToEnd()
          $p.WaitForExit(10000) | Out-Null
          if ($out -notmatch 'uciok') { throw "engine UCI handshake failed" }
          Write-Host "engine UCI handshake OK"

      # 应用本体冒烟：拉起主程序，确认进程存活且主窗口创建（引擎为懒启动，
      # 此步不覆盖引擎通道——引擎已由上一步握手自检验证）
      - name: Smoke-test app shell (launch + window)
        shell: pwsh
        run: ./tool/win_smoke_ci.ps1 -AppExe "build\windows\x64\runner\Release\tst_xiangqi.exe"

      - name: Rename zip with version
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Split('+')[0]
          $zip = "tst_xiangqi-$version-windows.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "zip: $zip ($((Get-Item $zip).Length) bytes)"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Attach zip to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 与 android-release 并行创建同一 Release：先尝试创建，
          # 已存在（对方先建）则改为追加附件。
          # 发行说明优先级：CHANGELOG.md 手写段落 > 提交历史自动分组，
          # 两种来源最终都会附带 GitHub 自动生成的提交对比
          $tag = $env:GITHUB_REF_NAME
          $notes = Get-Content CHANGELOG.md -Raw
          $section = $null
          if ($notes -match "(?ms)^## $([regex]::Escape($tag))\s*\n(.*?)(?=^## |\z)") {
            $section = $Matches[1].Trim()
          } else {
            # 自动生成：取上一 tag 以来的提交，按 conventional 类型分组
            $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
            if ($prevTag) { $range = "$prevTag..$tag" } else { $range = $tag }
            Write-Host "commit range: $range"
            $subjects = git log $range --no-merges --pretty=format:'%s'
            # 正则中用 \uFF1A 表示全角冒号，避免脚本文件编码差异导致解析失败
            function Group-Notes([string]$pattern, [string]$label) {
              $items = $subjects | Where-Object { $_ -imatch "^($pattern)(\([^)]*\))?[:\uFF1A]" } |
                ForEach-Object { $_ -ireplace "^[^:\uFF1A]*[:\uFF1A]\s*", "- " }
              if ($items) { "### $label`n$($items -join "`n")`n" }
            }
            $section = (Group-Notes 'feat' '新增') +
              (Group-Notes 'fix' '修复') +
              (Group-Notes 'perf' '优化') +
              (Group-Notes 'refactor' '重构') +
              (Group-Notes 'docs|test|chore|ci|style|build' '其他变更')
            $section = "$section".Trim()
          }
          if ($section) {
            gh release create $tag $env:ZIP_NAME --title $tag --notes $section --generate-notes
          } else {
            gh release create $tag $env:ZIP_NAME --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag $env:ZIP_NAME --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          }

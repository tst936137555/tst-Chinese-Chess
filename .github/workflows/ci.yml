name: Rust
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb xauth xdotool
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Fetch real Windows engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/fetch_engine.ps1 -Target windows
      - name: Fetch real macOS engine
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          brew install p7zip
          ./tool/fetch_engine.ps1 -Target macos
      - name: Require real engine on supported desktop runners
        if: runner.os != 'Linux'
        shell: bash
        run: echo 'XIANGQI_REQUIRE_ENGINE=1' >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Download integrity fallback regression
        shell: pwsh
        run: ./tool/test_download_fallback.ps1
      - name: Audio mixer loop regression
        run: cargo test --manifest-path vendor/quad-snd/Cargo.toml --lib
      - name: Native adapter restart regression
        if: runner.os != 'Windows'
        run: python3 tool/test_native_shim.py
      - name: Release build
        run: cargo build --release --locked
      - name: UI rendering and input smoke
        if: runner.os == 'Linux'
        run: timeout 90s xvfb-run -a ./target/release/tst-xiangqi --smoke-test target/ui-smoke
      - name: Real X11 mouse and keyboard input
        if: runner.os == 'Linux'
        run: timeout 120s xvfb-run -a python3 tool/ui_input_smoke.py target/release/tst-xiangqi
      - name: Stable viewport and coarse visual baselines
        if: runner.os == 'Linux'
        run: cargo run --release --locked --example check_ui -- target/ui-smoke
      - name: First-frame Chinese font atlas regression
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --example font_regression
          timeout 60s xvfb-run -a ./target/release/examples/font_regression target/font-regression
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ui-smoke
          path: target/ui-smoke/*.png
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/package_windows_rust.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rust-windows
          path: dist/*.zip

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package in the action's defaults is no longer available.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch assets
        shell: pwsh
        run: |
          sudo apt-get install -y p7zip-full
          ./tool/fetch_engine.ps1 -Target core
      - name: Build APK
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export NDK_HOME="$ANDROID_NDK_HOME"
          bash tool/build_android_rust.sh '${{ matrix.target }}'
      - name: Install and exercise debug APK in emulator
        if: matrix.target == 'x86_64-linux-android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tool/mobile_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-android-${{ matrix.target }}
          path: target/android-artifacts/**/tst-xiangqi-*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch assets
        shell: pwsh
        run: |
          brew install p7zip
          ./tool/fetch_engine.ps1 -Target core
      - name: Build native app
        run: bash tool/build_ios_rust.sh '${{ matrix.target }}'
      - name: Install and launch iOS simulator app
        if: matrix.target == 'aarch64-apple-ios-sim'
        run: python3 tool/ios_smoke.py 'dist/ios/aarch64-apple-ios-sim/tst-xiangqi.app'
      - name: Archive
        run: cd dist/ios && zip -r ../../rust-ios-${{ matrix.target }}.zip '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ios-${{ matrix.target }}
          path: rust-ios-*.zip

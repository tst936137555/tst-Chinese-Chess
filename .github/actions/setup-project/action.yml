name: Project toolchain
description: Install the repository Rust toolchain and a consistent Python runtime
inputs:
  targets:
    description: Additional Rust targets
    default: ''
  components:
    description: Additional Rust components
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
    - id: toolchain
      shell: bash
      run: |
        python -c 'import os,tomllib; v=tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"]; print("Rust:",v); open(os.environ["GITHUB_OUTPUT"],"a").write("channel="+v+"\n")'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      with:
        key: ${{ inputs.targets }}
        cache-on-failure: 'false'

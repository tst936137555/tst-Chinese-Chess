name: CI
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      native_macos_input:
        description: Run macOS OS input (runner must have Accessibility permission)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let versioned main-branch builds finish even when another commit arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
jobs:
  quality:
    name: Format, lint and tooling regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-project
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate all workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -shellcheck= -pyflakes=
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build scripts and smoke harness regressions
        run: python -m unittest discover -s tool -p 'test_*.py'
      - name: Record dependency and vendor inventory
        run: python tool/dependency_inventory.py target/dependencies.json
      - name: Verify release version and changelog on every change
        shell: bash
        run: python tool/release_notes.py --tag "v$(python tool/build_info.py version)" --output target/release-notes.md
  desktop:
    needs: quality
    uses: ./.github/workflows/desktop.yml
    with:
      native_macos_input: ${{ inputs.native_macos_input == true }}
  android:
    needs: quality
    uses: ./.github/workflows/android.yml
    with:
      verify_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    secrets: inherit
  ios:
    needs: quality
    uses: ./.github/workflows/ios.yml
  dependency-audit:
    needs: quality
    uses: ./.github/workflows/maintenance.yml
  ci:
    name: CI passed
    if: always()
    needs: [quality, desktop, android, ios, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every build and runtime check
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); print(results); assert results and all(r == "success" for r in results), "Required CI jobs failed, were cancelled, or were skipped"'

  release:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check Cargo version and skip published releases
        id: version
        run: python tool/release_automation.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: release-artifacts
          pattern: rust-*
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.version.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.version.outputs.publish == 'true'
        with:
          packages: build-tools;35.0.0
      - name: Verify signatures and publish stable release from this CI commit
        if: steps.version.outputs.publish == 'true'
        run: python tool/release_automation.py --publish --android-build-tools "$ANDROID_HOME/build-tools/35.0.0"
